<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Admin — khung trang</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/luxestay/components/bundle.css">
<link rel="stylesheet" href="luxestay.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="lx ls" data-theme="{{theme}}" style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans); color: var(--ink); background: var(--canvas);">
  <sc-if value="{{showDemo}}" hint-placeholder-val="{{true}}">
  <div class="dm dm--admin" role="note">
    <span class="dm__tag">Demo</span>
    <span>Đây là bản demo: dữ liệu được làm mới mỗi 24 giờ, thanh toán và email không được gửi thật.</span>
    <a class="dm__more" href="#">Mua mã nguồn</a>
    <button class="dm__x" aria-label="Đóng thông báo demo" onClick="{{hideDemo}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  </sc-if>
  <div class="ad" style="flex: 1; min-height: 0;">
    <dc-import name="AdminSidebar" collapsed="{{collapsed}}" active="dashboard" theme="{{theme}}" hint-size="264px,100%"></dc-import>
    <div class="am">
      <dc-import name="AdminTopbar" notif-open="{{notifOpen}}" acct-open="{{acctOpen}}" compact="{{collapsed}}" theme="{{theme}}" hint-size="100%,72px"></dc-import>
      <main class="am__body" aria-busy="true">
        <div class="am__head">
          <div>
            <ol class="crumbs"><li><a href="#">Quản trị</a></li><li>Dashboard</li></ol>
            <h1>Chào buổi chiều, Thu Hà</h1>
            <p>Thứ Năm, 8 tháng 10, 2026 · 12 khách nhận phòng và 9 khách trả phòng hôm nay.</p>
          </div>
          <div class="am__actions">
            <div class="ls-seg-ctl" role="group" aria-label="Khoảng thời gian"><button aria-pressed="true">7 ngày</button><button aria-pressed="false">30 ngày</button><button aria-pressed="false">Tuỳ chọn</button></div>
          </div>
        </div>
        <div class="kpis">
          <div class="card card__pad"><span class="ls-skel ls-skel--text" style="width: 55%;"></span><span class="ls-skel" style="height: 40px; width: 70%; margin-top: 12px;"></span><span class="ls-skel ls-skel--text" style="width: 40%; margin-top: 12px;"></span></div>
          <div class="card card__pad"><span class="ls-skel ls-skel--text" style="width: 55%;"></span><span class="ls-skel" style="height: 40px; width: 70%; margin-top: 12px;"></span><span class="ls-skel ls-skel--text" style="width: 40%; margin-top: 12px;"></span></div>
          <div class="card card__pad"><span class="ls-skel ls-skel--text" style="width: 55%;"></span><span class="ls-skel" style="height: 40px; width: 70%; margin-top: 12px;"></span><span class="ls-skel ls-skel--text" style="width: 40%; margin-top: 12px;"></span></div>
          <div class="card card__pad"><span class="ls-skel ls-skel--text" style="width: 55%;"></span><span class="ls-skel" style="height: 40px; width: 70%; margin-top: 12px;"></span><span class="ls-skel ls-skel--text" style="width: 40%; margin-top: 12px;"></span></div>
        </div>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; flex: 1;">
          <div class="card card__pad" style="display: flex; flex-direction: column; gap: 16px;">
            <span class="ls-skel ls-skel--title" style="width: 30%;"></span>
            <div style="flex: 1; display: flex; align-items: flex-end; gap: 12px; min-height: 220px;">
              <span class="ls-skel" style="flex: 1; height: 42%;"></span><span class="ls-skel" style="flex: 1; height: 58%;"></span><span class="ls-skel" style="flex: 1; height: 50%;"></span><span class="ls-skel" style="flex: 1; height: 72%;"></span><span class="ls-skel" style="flex: 1; height: 64%;"></span><span class="ls-skel" style="flex: 1; height: 88%;"></span><span class="ls-skel" style="flex: 1; height: 76%;"></span>
            </div>
          </div>
          <div class="card card__pad" style="display: flex; flex-direction: column; gap: 14px;">
            <span class="ls-skel ls-skel--title" style="width: 50%;"></span>
            <span class="ls-skel ls-skel--circle" style="width: 160px; height: 160px; align-self: center; margin: 12px 0;"></span>
            <span class="ls-skel ls-skel--text"></span>
            <span class="ls-skel ls-skel--text" style="width: 70%;"></span>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collapsed":{"editor":"boolean","default":false},"notifOpen":{"editor":"boolean","default":true},"acctOpen":{"editor":"boolean","default":false},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { demo: true };
  }
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      collapsed: !!(this.props.collapsed ?? false),
      notifOpen: !!(this.props.notifOpen ?? true),
      acctOpen: !!(this.props.acctOpen ?? false),
      showDemo: this.state.demo,
      hideDemo: () => this.setState({ demo: false })
    };
  }
}
</script>
</body>
</html>
