# Serves the built web app and forwards API, uploads and websocket traffic to
# the api container, so the browser only ever talks to one origin.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Room photos are capped at 2 MB by the API; leave some headroom.
  client_max_body_size 5m;

  # Needed by the Google sign-in popup.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
  }

  location /socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
