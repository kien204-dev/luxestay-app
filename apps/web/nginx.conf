# Serves the built web app and forwards API, uploads and websocket traffic to
# the api container, so the browser only ever talks to one origin.
# Behind another HTTPS proxy or tunnel, keep the scheme the visitor really
# used; otherwise the API would build http:// links (uploaded photos) for an
# https:// page. Without such a proxy this is simply the scheme nginx sees.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Text assets travel compressed: the app's JavaScript is about a third of
  # its size that way. Images and fonts (woff2) are already compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  # Image uploads are capped at 10 MB by the API; leave room for the form fields.
  client_max_body_size 11m;

  # Needed by the Google sign-in popup: lets the page keep talking to the
  # window it opened. Sent once on every response: the API's own copy of the
  # header is dropped, and a location with its own add_header repeats this
  # line (nginx does not inherit add_header into such a location).
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  proxy_hide_header Cross-Origin-Opener-Policy;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /uploads/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
